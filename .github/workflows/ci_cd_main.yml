name: LogicHive CI/CD # Triggering update

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnostic:
    name: Diagnostic Start
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow triggered successfully"

  test:
    name: Test and Lint (Native Target)
    runs-on: ubuntu-latest
    env:
      LOGICHIVE_TESTING: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        run: pipx install uv

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pre-cache numpy for uv run offline tests
        run: uv run --with numpy --no-project python -c "import numpy"

      - name: Run Lint (Ruff)
        run: |
          # Run linting on the whole repository using pyproject.toml rules.
          # Line length is 100, and non-core files have relaxed rules via per-file-ignores.
          uv run ruff check .

      - name: Run tests
        run: |
          uv run pytest tests/unit tests/integration tests/system

  release_version:
    name: Semantic Release
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm install
      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

  build_exe:
    name: Build and Upload Windows EXE
    needs: release_version
    if: |
      needs.release_version.outputs.new_release_published == 'true' || 
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          uv run pyinstaller --noconfirm --clean tools/packaging/LogicHive.spec
          # Rename based on branch
          if ("${{ github.ref_name }}" -eq "develop") {
            Move-Item dist/LogicHive-MCP.exe dist/LogicHive-MCP-dev.exe
          }

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release_version.outputs.new_release_version }}
        run: |
          if ("${{ github.ref_name }}" -eq "develop") {
             $exe_file = "dist/LogicHive-MCP-dev.exe"
             $tag = "v-develop"
             # Create pre-release if it does not exist
             gh release create $tag --prerelease --title "LogicHive Development Pre-release" --notes "Rolling pre-release build for the develop branch." --target "develop" 2>$null
             gh release upload $tag $exe_file --clobber
          } else {
             $exe_file = "dist/LogicHive-MCP.exe"
             gh release upload "v$env:RELEASE_VERSION" $exe_file --clobber
          }
