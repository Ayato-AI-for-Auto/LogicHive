name: LogicHive CI/CD # Triggering update

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnostic:
    name: Diagnostic Start
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow triggered successfully"

  test:
    name: Test and Lint (Native Target)
    runs-on: ubuntu-latest
    env:
      LOGICHIVE_TESTING: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        run: pipx install uv

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pre-cache numpy for uv run offline tests
        run: uv run --with numpy --no-project python -c "import numpy"

      - name: Run Lint (Ruff)
        run: |
          # 1. Strict check for Core Logic (src)
          uv run ruff check src --select E,F,W,I,C90,T20 --line-length 100
          
          # 2. Relaxed check for non-core files (scripts, tests, tools)
          # We ignore T20 (print), E501 (line length), and C901 (complexity) for these.
          uv run ruff check tests tools --ignore T20,E501,C901 --line-length 120

      - name: Run tests
        run: |
          uv run pytest tests/unit tests/integration tests/system

  release_version:
    name: Semantic Release
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm install
      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          if [ -f .VERSION_PUBLISHED ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=$(cat .VERSION_PUBLISHED)" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

  build_exe:
    name: Build and Upload Windows EXE
    needs: release_version
    if: |
      needs.release_version.outputs.new_release_published == 'true' || 
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          uv run pyinstaller --noconfirm --clean tools/packaging/LogicHive.spec
          
          # Verify the build succeeded
          if ($LASTEXITCODE -ne 0) {
              Write-Error "PyInstaller build failed"
              exit 1
          }
          
          # Check what was actually created
          Write-Host "Contents of dist directory:"
          Get-ChildItem -Path dist -Recurse
          
          # Rename based on branch
          if ("${{ github.ref_name }}" -eq "develop") {
            if (Test-Path "dist/LogicHive-MCP.exe") {
                Move-Item dist/LogicHive-MCP.exe dist/LogicHive-MCP-dev.exe
            } else {
                Write-Error "Expected file dist/LogicHive-MCP.exe not found after build"
                exit 1
            }
            if (Test-Path "dist/logichive-hub.exe") {
                Move-Item dist/logichive-hub.exe dist/logichive-hub-dev.exe
            }
          }

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release_version.outputs.new_release_version }}
          IS_PUBLISHED: ${{ needs.release_version.outputs.new_release_published }}
        run: |
          $tag = ""
          if ("$env:IS_PUBLISHED" -eq "true") {
             $tag = "v$env:RELEASE_VERSION"
          } elseif ("${{ github.ref_name }}" -eq "develop") {
             $tag = "v-develop"
             # Create pre-release if it does not exist
             gh release create $tag --prerelease --title "LogicHive Development Pre-release" --notes "Rolling pre-release build for the develop branch." --target "develop" 2>$null
          }

          if ($tag -ne "") {
             $exe_file = if (Test-Path "dist/LogicHive-MCP-dev.exe") { "dist/LogicHive-MCP-dev.exe" } else { "dist/LogicHive-MCP.exe" }
             $hub_file = if (Test-Path "dist/logichive-hub-dev.exe") { "dist/logichive-hub-dev.exe" } else { "dist/logichive-hub.exe" }
             
             Write-Host "Targeting Release: $tag"
             Write-Host "Uploading Assets: $exe_file, $hub_file"
             
             gh release upload $tag $exe_file $hub_file --clobber
          } else {
             Write-Error "No target tag identified for release upload."
             exit 1
          }
