# LogicHive CLA Check Workflow
name: CLA Check

on:
  pull_request_target:
    types: [opened, synchronize, edited]

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA Agreement in PR Body
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const claAgreed = prBody.includes('I have read and agree to the CLA for LogicHive');
            
            if (!claAgreed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `## 🛡️ CLA Agreement Required\n\nThank you for your contribution! To maintain LogicHive's dual-license model, we require all contributors to agree to our **Contributor License Agreement (CLA)**.\n\n### Action Required\n\nPlease add the following line to your Pull Request description:\n\n> I have read and agree to the CLA for LogicHive.\n\n[Read the full CLA here](./CLA.md)\n\n*Note: This check will re-run automatically once you edit the description.*`
              });
              core.setFailed('CLA not agreed. Please edit the PR description to include the agreement statement.');
            }
