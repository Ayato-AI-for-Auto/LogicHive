[project]
name = "logichive-hub"
version = "0.10.0-dev.2"
description = "LogicHive: Private Hub Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
    "google-genai",
    "aiosqlite",
    "numpy",
    "ollama",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "python-dateutil",
    "fastmcp",
    "faiss-cpu",
    "radon",
    "ruff",
    "mypy",
    "stripe",
    "streamlit",
    "pandas",
    "pyinstaller",
    "psutil",
    "flet",
    "aiohttp>=3.13.5",
    "pydantic>=2.12.5",
    "loguru>=0.7.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api", "core", "storage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

# Do not strictly exclude everything; CI wants to check all files but with relaxed rules outside core logic
exclude = [
    ".git",
    ".venv",
    "dist",
    "build",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C90", # mccabe (complexity)
    "T20", # flake8-print
]

[tool.ruff.lint.per-file-ignores]
# Relax rules for non-core scripts (exports, scratch, tools)
"scratch/**/*.py" = ["T201", "E501", "C901", "F401", "F841"]
"tools/**/*.py" = ["T201", "E501", "C901"]
"exports/**/*.py" = ["T201", "E501", "C901"]
"tests/**/*.py" = ["T201"] # Tests can use print

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "storage"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "flet.*"
ignore_missing_imports = true
