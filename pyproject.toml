[project]
name = "logichive-hub"
version = "0.30.0"
description = "LogicHive: Private Hub Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
    "google-genai",
    "aiosqlite",
    "numpy",
    "ollama",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "python-dateutil",
    "fastmcp",
    "chromadb",
    "fastembed",
    "radon",
    "ruff",
    "mypy",
    "stripe",
    "streamlit",
    "pandas",
    "pyinstaller",
    "psutil",
    "flet",
    "flet-desktop",
    "aiohttp>=3.13.5",
    "pydantic>=2.12.5",
    "loguru>=0.7.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api", "core", "storage"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

# Do not strictly exclude everything; CI wants to check all files but with relaxed rules outside core logic
exclude = [
    ".git",
    ".venv",
    "dist",
    "build",
    "node_modules",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C90", # mccabe (complexity)
    "T20", # flake8-print
]
ignore = [
    "T20",   # Ignore print warnings in CI
    "E501",  # Ignore line too long in CI
    "C90",   # Ignore mccabe complexity in CI
]

[tool.ruff.lint.per-file-ignores]
# Realistic Compromise: Relax rules for non-core scripts and assets
# T201: allow print, E501: allow long lines, C901: allow high complexity
# I001: allow unsorted imports, E402: allow imports not at top, F541: allow raw f-strings
"scratch/**/*.py" = ["T201", "E501", "C901", "F401", "F841", "I001", "E402", "F541", "W293"]
"tools/**/*.py" = ["T201", "E501", "C901", "W293", "I001", "E402"]
"exports/**/*.py" = ["T201", "E501", "C901", "F821", "I001", "W293", "W291", "W292", "F541"] # exports are snippets
"tests/**/*.py" = ["T201", "E501", "I001"] # Tests can use print and long assertions, lenient on import sorting
"*.py" = ["T201", "E501", "I001"] # Root level scripts

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "storage"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "flet.*"
ignore_missing_imports = true
